<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FitCompass - Profile</title>

<style>
:root{
  --bg-main:#1f4d69;
  --bg-sidebar:#d8eff4;
  --btn-green:#a9d99b;
  --btn-red:#d83a4a;
  --card:#d8eff4;
  --text-dark:#0f1a1f;
  --shadow:0 10px 30px rgba(0,0,0,.18);
  --radius:14px;
  --font:ui-monospace, Menlo, Consolas, monospace;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:var(--font);
  background:#0f2330;
  color:white;
  min-height:100vh;
}

.app{ display:flex; min-height:100vh; }

/* Sidebar */
.sidebar{
  width:260px;
  background:var(--bg-sidebar);
  color:var(--text-dark);
  display:flex;
  flex-direction:column;
  padding:18px 14px;
  border-right:3px solid rgba(0,0,0,.08);
}

.sidebar-title{
  font-size:20px;
  margin-bottom:10px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:10px;
  flex:1;
}

.nav button{
  border:none;
  border-radius:10px;
  padding:12px;
  background:white;
  font-family:var(--font);
  cursor:pointer;
  text-align:left;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
  transition:0.2s;
}

.nav button:hover{
  background:var(--btn-green);
}

.logout button{
  border:none;
  border-radius:10px;
  padding:14px;
  background:var(--btn-red);
  font-family:var(--font);
  cursor:pointer;
  color:white;
}

.main{
  flex:1;
  background:var(--bg-main);
  padding:22px;
}

.banner{
  background:rgba(255,255,255,.12);
  padding:14px;
  border-radius:12px;
  margin-bottom:20px;
}

.profile-container{
  display:flex;
  gap:30px;
  flex-wrap:wrap;
  align-items: flex-start;
}

.profile-card{
  background:var(--card);
  color:black;
  border-radius:12px;
  padding:20px;
  width:350px;
  box-shadow:var(--shadow);
}

.profile-pic{
  width:150px;
  height:200px;
  border-radius:0; 
  background:rgba(0,0,0,.15);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:15px;
  position:relative;
  overflow:hidden;
}

.michalis-layers{
  position:relative;
  width:100%;
  height:100%;
}

.michalis-layers img{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:contain;
}

.profile-info p{
  margin:8px 0;
}

.stats-card{
  background:var(--card);
  color:black;
  border-radius:12px;
  padding:20px;
  flex:1;
  min-width:300px;
  box-shadow:var(--shadow);
}

.stat{
  margin-bottom:15px;
}

.stat-bar{
  background:white;
  border-radius:8px;
  height:20px;
  overflow:hidden;
}

.stat-fill{
  height:100%;
  background:var(--btn-green);
  transition:width 0.4s ease;
}

.edit-btn{
  margin-top:18px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:var(--btn-green);
  color:var(--text-dark);
  font-family:var(--font);
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
  transition:all 0.2s ease;
}

.edit-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 16px rgba(0,0,0,.2);
  background:#8fce82;
}

.edit-btn:active{
  transform:scale(0.98);
}

/* --- FRIEND SYSTEM CSS --- */
.friends-card {
  background: var(--card);
  color: black;
  border-radius: 12px;
  padding: 20px;
  flex: 1;
  min-width: 300px;
  box-shadow: var(--shadow);
}

.friend-search {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}

.friend-search input {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: none;
  font-family: var(--font);
}

.friend-search button {
  padding: 10px 15px;
  border: none;
  border-radius: 8px;
  background: var(--bg-main);
  color: white;
  font-family: var(--font);
  font-weight: bold;
  cursor: pointer;
}

.friend-search button:hover {
  filter: brightness(1.2);
}

.friend-msg {
  font-size: 13px;
  margin-bottom: 15px;
  min-height: 18px;
  font-weight: bold;
}

.friends-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.friend-item {
  background: rgba(255, 255, 255, 0.6);
  padding: 10px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.friend-avatar-placeholder {
  width: 35px;
  height: 35px;
  background: rgba(0,0,0,0.1);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  color: var(--text-dark);
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar">
  <div class="sidebar-title">FitCompass</div>

  <div class="nav">
      <button onclick="location.href='{{ url_for('home') }}'">Home</button>
      <button onclick="location.href='{{ url_for('profile') }}'">Profile</button>
      <button onclick="location.href='{{ url_for('history') }}'">History</button>
      <button onclick="location.href='{{ url_for('library') }}'">Library</button>
      <button onclick="location.href='{{ url_for('shop') }}'">Shop</button>
      <button onclick="location.href='{{ url_for('inbox') }}'">Inbox</button>
  </div>

  <div class="logout">
    <button onclick="location.href='{{ url_for('logout') }}'">Log Out</button>
  </div>
</aside>

<main class="main">

  <div class="banner">
    <strong>{{ username }}'s Profile</strong>
  </div>

  <div class="profile-container">
   
    <div class="profile-card">
      <div class="profile-pic">
        <div class="michalis-layers">
          <img src="{{ url_for('static', filename='michalis/template.png') }}" alt="body">
          <img src="{{ url_for('static', filename='michalis/low arms.png') }}" alt="arms">
          <img src="{{ url_for('static', filename='michalis/slightsmile.png') }}" alt="face">
          <img src="{{ url_for('static', filename='outfits/low arms/' + (equipped if equipped else 'business') + ' low arms.png') }}" alt="sleeves">
          <img src="{{ url_for('static', filename='outfits/torso/' + (equipped if equipped else 'business') + ' torso.png') }}" alt="torso">
        </div>
      </div>

      <div class="profile-info">
        <p><strong>Username:</strong> {{ username }}</p>
        <p><strong>Email:</strong> {{ email }}</p>
        <p><strong>Goal:</strong> {{ goal }}</p>
        <p><strong>Total Points:</strong> {{ points }}</p>
        <p><strong>Workouts Per Week:</strong> {{ workouts_per_week }}</p>
      </div>

      <button class="edit-btn" onclick="location.href='{{ url_for('profileEdit') }}'">
        Edit Profile
      </button>
    </div>

    <div class="stats-card">
      <h3>Progress Stats</h3>
      <div class="stat">
        <p>Weekly Goal Completion ({{ goal_percent }}%)</p>
        <div class="stat-bar">
          <div class="stat-fill" style="width: {{ goal_percent }}%;"></div>
        </div>
      </div>
    </div>

    <div class="friends-card">
      <h3>My Friends</h3>
      
      <div class="friend-search">
        <input type="text" id="friendInput" placeholder="Enter username...">
        <button onclick="addFriend()">Add</button>
      </div>
      <div id="friendMsg" class="friend-msg"></div>

      <div id="requestsSection" style="display:none;">
        <h4 style="margin:10px 0 6px;">Friend Requests</h4>
        <div class="friends-list" id="requestsList"></div>
      </div>

      <div class="friends-list" id="friendsList"></div>

      <div id="recsSection" style="display:none;">
        <h4 style="margin:14px 0 6px;">Suggested for You</h4>
        <div class="friends-list" id="recsList"></div>
      </div>
    </div>

  </div>
</main>
</div>

<script>
  async function loadFriends() {
    try {
      const response = await fetch('/get_friends');
      const friends = await response.json();
      const listDiv = document.getElementById('friendsList');
      listDiv.innerHTML = '';

      if (friends.error) {
        listDiv.innerHTML = '<p>Error loading friends.</p>';
        return;
      }

      if (friends.length === 0) {
        listDiv.innerHTML = '<p style="color: #666; font-style: italic;">No friends added yet. Search for a username above!</p>';
        return;
      }

      friends.forEach(f => {
        // Grab the first letter of their username for the placeholder avatar
        const initial = f.username.charAt(0).toUpperCase();
        
        listDiv.innerHTML += `
          <div class="friend-item">
            <div class="friend-avatar-placeholder">${initial}</div>
            <strong>${f.username}</strong>
          </div>
        `;
      });
    } catch (error) {
      console.error("Failed to fetch friends:", error);
    }
  }

  async function addFriend() {
    const input = document.getElementById('friendInput');
    const msgDiv = document.getElementById('friendMsg');
    const friendUsername = input.value.trim();

    if (!friendUsername) return;

    try {
      const response = await fetch('/add_friend', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ friend_username: friendUsername })
      });
      
      const result = await response.json();

      if (response.ok) {
        msgDiv.style.color = '#1f4d69'; // Success color
        msgDiv.innerText = result.message;
        input.value = ''; // clear the box
        loadFriends(); // Refresh the list instantly!
      } else {
        msgDiv.style.color = '#d83a4a'; // Error color (red)
        msgDiv.innerText = result.error || "Could not add friend.";
      }
    } catch (error) {
      msgDiv.style.color = '#d83a4a';
      msgDiv.innerText = "Server error communicating with database.";
    }
  }

  async function loadRequests() {
    try {
      const response = await fetch('/get_friend_requests');
      const requests = await response.json();
      const section = document.getElementById('requestsSection');
      const listDiv = document.getElementById('requestsList');
      listDiv.innerHTML = '';

      if (!Array.isArray(requests) || requests.length === 0) {
        section.style.display = 'none';
        return;
      }

      section.style.display = 'block';
      requests.forEach(r => {
        const initial = r.username.charAt(0).toUpperCase();
        listDiv.innerHTML += `
          <div class="friend-item">
            <div class="friend-avatar-placeholder">${initial}</div>
            <strong style="flex:1;">${r.username}</strong>
            <button onclick="respondToRequest('${r.username}', true)">Accept</button>
            <button onclick="respondToRequest('${r.username}', false)">Decline</button>
          </div>
        `;
      });
    } catch (error) {
      console.error("Failed to fetch requests:", error);
    }
  }

  async function respondToRequest(username, accept) {
    const endpoint = accept ? '/accept_friend' : '/decline_friend';
    const msgDiv = document.getElementById('friendMsg');
    try {
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ friend_username: username })
      });
      const result = await response.json();
      if (response.ok) {
        msgDiv.style.color = '#1f4d69';
        msgDiv.innerText = result.message;
        loadRequests(); // refresh pending list
        loadFriends();  // refresh accepted friends
      } else {
        msgDiv.style.color = '#d83a4a';
        msgDiv.innerText = result.error || "Action failed.";
      }
    } catch (error) {
      msgDiv.style.color = '#d83a4a';
      msgDiv.innerText = "Server error.";
    }
  }

  async function loadRecommendations() {
    try {
      const response = await fetch('/recommend_friends');
      const recs = await response.json();
      const section = document.getElementById('recsSection');
      const listDiv = document.getElementById('recsList');
      listDiv.innerHTML = '';

      if (!Array.isArray(recs) || recs.length === 0) {
        section.style.display = 'none';
        return;
      }

      section.style.display = 'block';
      recs.forEach(r => {
        const initial = r.username.charAt(0).toUpperCase();
        const wpw = r.workouts_per_week ? ` &middot; ${r.workouts_per_week}x/week` : '';
        listDiv.innerHTML += `
          <div class="friend-item">
            <div class="friend-avatar-placeholder">${initial}</div>
            <div style="flex:1;">
              <strong>${r.username}</strong>
              <div style="font-size:12px;color:#444;">Goal: ${r.goal}${wpw}</div>
            </div>
            <button onclick="requestFriend('${r.username}')">Add</button>
          </div>
        `;
      });
    } catch (error) {
      console.error("Failed to fetch recommendations:", error);
    }
  }

  async function requestFriend(username) {
    const msgDiv = document.getElementById('friendMsg');
    try {
      const response = await fetch('/add_friend', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ friend_username: username })
      });
      const result = await response.json();
      if (response.ok) {
        msgDiv.style.color = '#1f4d69';
        msgDiv.innerText = result.message;
        loadRecommendations();
      } else {
        msgDiv.style.color = '#d83a4a';
        msgDiv.innerText = result.error || "Could not send request.";
      }
    } catch (error) {
      msgDiv.style.color = '#d83a4a';
      msgDiv.innerText = "Server error.";
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadFriends();
    loadRequests();
    loadRecommendations();
  });
</script>

</body>
</html>
